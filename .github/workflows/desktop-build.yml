name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            artifact: localquest-macos
            bundles: dmg
          - os: windows-2022
            platform: windows
            artifact: localquest-windows
            bundles: nsis,msi
          - os: ubuntu-22.04
            platform: linux
            artifact: localquest-linux
            bundles: deb
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.platform
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        working-directory: .

      - name: Install app dependencies
        run: npm ci

      - name: Install bundled TypeScript runner dependencies
        run: npm ci
        working-directory: typescript

      - name: Build native installer
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            web/src-tauri/target/release/bundle/dmg/*.dmg
            web/src-tauri/target/release/bundle/nsis/*-setup.exe
            web/src-tauri/target/release/bundle/msi/*.msi
            web/src-tauri/target/release/bundle/appimage/*.AppImage
            web/src-tauri/target/release/bundle/deb/*.deb
